<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>釣りの記録</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; line-height: 1.7; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 10px; }
  input, textarea { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
  button { margin-top: 14px; padding: 10px 18px; font-size: 16px; }
  .record { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-top: 12px; }
  .record button { margin-top: 6px; padding: 4px 10px; font-size: 14px; }
</style>
</head>
<body>
<h1>🎣 釣りの記録</h1>
<p>釣りに行った記録を残す、ヒデさん専用の小さなアプリです。書いた記録はこのスマホ・パソコンの中に保存されます。</p>

<label>日付 <input type="date" id="date" value="2026-11-23"></label>
<label>場所 <input type="text" id="place" value="高知・灘港"></label>
<label>釣った魚 <input type="text" id="fish" placeholder="例：マダイ"></label>
<label>匹数 <input type="number" id="count" min="0" placeholder="例：3"></label>
<label>メモ <textarea id="memo" rows="2" placeholder="使った仕掛けや天気など"></textarea></label>
<button onclick="addRecord()">記録を追加する</button>

<h2>これまでの記録</h2>
<div id="list"></div>

<script>
  let records = JSON.parse(localStorage.getItem('fishing-records') || '[]');
  function showRecords() {
    const list = document.getElementById('list');
    if (records.length === 0) {
      list.innerHTML = '<p>まだ記録がありません。</p>';
      return;
    }
    list.innerHTML = '';
    records.forEach(function (r, i) {
      const div = document.createElement('div');
      div.className = 'record';
      div.innerHTML = '<b>' + r.date + '　' + r.place + '</b><br>'
        + '釣った魚：' + (r.fish || '—') + '　' + (r.count || '—') + '匹<br>'
        + 'メモ：' + (r.memo || '—') + '<br>';
      const del = document.createElement('button');
      del.textContent = 'この記録を消す';
      del.onclick = function () {
        records.splice(i, 1);
        localStorage.setItem('fishing-records', JSON.stringify(records));
        showRecords();
      };
      div.appendChild(del);
      list.appendChild(div);
    });
  }
  function addRecord() {
    const r = {
      date: document.getElementById('date').value,
      place: document.getElementById('place').value,
      fish: document.getElementById('fish').value,
      count: document.getElementById('count').value,
      memo: document.getElementById('memo').value
    };
    if (!r.date || !r.place) {
      alert('日付と場所を入れてください。');
      return;
    }
    records.unshift(r);
    localStorage.setItem('fishing-records', JSON.stringify(records));
    document.getElementById('fish').value = '';
    document.getElementById('count').value = '';
    document.getElementById('memo').value = '';
    showRecords();
  }
  showRecords();
</script>
</body>
</html>
